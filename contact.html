    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">TravelNest</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>

            </ul>
        </div>
    </div>
</nav>

<!-- Contact Section -->
<section class="container my-5">
    <h1 class="text-center mb-4">Contact Us</h1>

    <div class="row">
        <div class="col-md-6">
            <h3>Get in Touch</h3>
            <p><strong>📍 Address:</strong> Pune, Maharashtra, India</p>
            <p><strong>📞 Phone:</strong> +91 8530218016</p>
            <p><strong>📧 Email:</strong> travelnest@gmail.com</p>
        </div>

        <div class="col-md-6">
            <form>
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" placeholder="Enter your name">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" placeholder="Enter your email">
                </div>

                <div class="mb-3">
                    <label class="form-label">Message</label>
                    <textarea class="form-control" rows="5" placeholder="Write your message"></textarea>
                </div>

                <button type="button" class="btn btn-primary w-100"
                        onclick="alert('Thank you! We will contact you soon.')">
                    Send Message
                </button>
            </form>
        </div>
    </div>
</section>
